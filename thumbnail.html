<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fabric</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html,body{margin:0;padding:0}
  body{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--brand-600);display:flex;align-items:center;justify-content:center;gap:40px;padding:0 60px}
  .main img{width:200px;height:200px;flex:none}
  .name{font-family:var(--font-display);font-size:150px;font-weight:500;letter-spacing:-0.02em;color:var(--stone-50);line-height:1;white-space:nowrap}
  .strip{width:320px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
<div class="main"><img src="assets/fabric-mark.svg" alt="" /><div class="name">Fabric</div></div>
<div class="strip"><div style="background:var(--ochre-300)"></div><div style="background:var(--marsh-400)"></div><div style="background:var(--rust-600)"></div><div style="background:var(--marsh-800)"></div></div>
</body>
</html>
